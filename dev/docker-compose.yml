services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: ${MINIO_CONTAINER:?set MINIO_CONTAINER via ./scripts/init-project.sh}
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio_init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: ${MINIO_CONTAINER}_init
    depends_on:
      - minio
    volumes:
      - ../policy/public-read.json:/policy/public-read.json:ro
    entrypoint: >
      /bin/sh -c "
      set -e;
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do
        echo 'waiting for minio...';
        sleep 2;
      done;
      mc mb --ignore-existing local/$${MINIO_BUCKET};
      mc anonymous set-json /policy/public-read.json local/$${MINIO_BUCKET};
      echo 'anonymous GetObject enabled for $${MINIO_BUCKET}/public/*';
      mc anonymous get-json local/$${MINIO_BUCKET};
      echo 'bucket ready:' $${MINIO_BUCKET};
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:?set MINIO_BUCKET via ./scripts/init-project.sh}
    restart: "no"

volumes:
  minio_data:
