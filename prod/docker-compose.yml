services:
  minio:
    # Keep in sync with existing volume data. Downgrading (e.g. 2025-09 → 2024-12)
    # often crash-loops. Pin a known-good RELEASE instead of :latest.
    image: public.ecr.aws/y9w4h2u9/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: ${MINIO_CONTAINER:?set MINIO_CONTAINER via ./scripts/init-project.sh}
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      app_network:
        # Service DNS for app (MinIO JS forbids underscores in hostnames)
        aliases:
          - minio
      proxy: {}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      # Public assets only (never private/*)
      - "traefik.http.routers.englishpsd-minio-assets.rule=Host(`${MINIO_PUBLIC_HOST:?set MINIO_PUBLIC_HOST}`) && PathPrefix(`/public`)"
      - "traefik.http.routers.englishpsd-minio-assets.entrypoints=websecure"
      - "traefik.http.routers.englishpsd-minio-assets.tls=true"
      - "traefik.http.routers.englishpsd-minio-assets.tls.certresolver=letsencrypt"
      # Path-style MinIO: /public/... → /<bucket>/public/...
      - "traefik.http.routers.englishpsd-minio-assets.middlewares=englishpsd-minio-bucket-prefix"
      - "traefik.http.middlewares.englishpsd-minio-bucket-prefix.addprefix.prefix=/${MINIO_BUCKET:?set MINIO_BUCKET}"
      - "traefik.http.services.englishpsd-minio-assets.loadbalancer.server.port=9000"
  minio_init:
    image: ghcr.io/golithus/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: ${MINIO_CONTAINER}_init
    depends_on:
      - minio
    volumes:
      - ../policy/public-read.json:/policy/public-read.json:ro
    entrypoint: >
      /bin/sh -c "
      set -e;
      # Compose sibling DNS: service alias 'minio' (no underscore).
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do
        echo 'waiting for minio...';
        sleep 2;
      done;
      mc mb --ignore-existing local/$${MINIO_BUCKET};
      mc anonymous set-json /policy/public-read.json local/$${MINIO_BUCKET};
      echo 'anonymous GetObject enabled for $${MINIO_BUCKET}/public/*';
      mc anonymous get-json local/$${MINIO_BUCKET};
      echo 'bucket ready:' $${MINIO_BUCKET};
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:?set MINIO_BUCKET via ./scripts/init-project.sh}
    networks:
      - app_network
    restart: "no"

volumes:
  minio_data:

networks:
  app_network:
    name: ${MINIO_NETWORK:?set MINIO_NETWORK via ./scripts/init-project.sh}
    external: true
  proxy:
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true
